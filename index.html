<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhiUI Framework - Official Docs</title>
    <style>
        :root {
            --bg: #050505;
            --sidebar-bg: #111111;
            --card-bg: #181818;
            --accent: #007aff;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --code-bg: #000000;
            --success: #34c759;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            overflow-x: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid #222;
            position: fixed;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 100;
        }

        .logo-area {
            padding: 20px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .logo-area h2 { margin: 0; color: var(--accent); font-weight: 800; letter-spacing: 1px; }

        .nav-item {
            display: block;
            padding: 12px 15px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.2s;
            font-size: 14px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 122, 255, 0.1);
            color: var(--accent);
        }

        /* 主内容区 */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px 60px;
            max-width: 1000px;
        }

        /* 语言切换器 */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            padding: 5px;
            border-radius: 20px;
            display: flex;
            z-index: 1000;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px 18px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        /* API 卡片 */
        .section-title { font-size: 2rem; margin-top: 60px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid #252525;
            position: relative;
        }

        .card h3 { margin-top: 0; color: var(--accent); font-family: monospace; }
        .card p { color: var(--text-dim); font-size: 0.95rem; }

        /* 代码高亮 */
        .code-block {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-top: 15px;
            position: relative;
            overflow-x: auto;
        }

        pre { margin: 0; font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; color: #abb2bf; }

        .copy-btn {
            position: absolute; right: 10px; top: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid #333; color: white;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;
        }

        /* 移动端适配 */
        @media (max-width: 800px) {
            .sidebar { transform: translateX(-100%); transition: 0.3s; }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLang('zh')">中文</button>
        <button class="lang-btn" onclick="setLang('en')">English</button>
    </div>

    <aside class="sidebar">
        <div class="logo-area">
            <h2>zhiUI HUB</h2>
        </div>
        <nav id="side-nav">
            </nav>
    </aside>

    <main class="main-content">
        <header id="hero">
            <h1 id="main-title">载入中...</h1>
            <p id="main-subtitle"></p>
        </header>

        <div id="content-area">
            </div>

        <footer style="margin-top: 100px; text-align: center; color: #444;">
            zhiUI Framework © 2026 | Developed by yda66722-hash
        </footer>
    </main>

    <script>
        const translations = {
            zh: {
                title: "zhiUI 开发者文档",
                subtitle: "为 Roblox 性能与审美优化的现代化脚本 UI 库",
                sections: {
                    init: "核心初始化",
                    notify: "通知系统",
                    elements: "全功能组件"
                },
                items: [
                    { id: "load", type: "init", name: "远程引用", desc: "将此代码放入脚本顶部以加载 zhiUI。", code: 'local zhiUI = loadstring(game:HttpGet("https://raw.githubusercontent.com/yda66722-hash/zhiUI/refs/heads/main/zhiUI"))()' },
                    { id: "win", type: "init", name: "创建窗口", desc: "初始化主窗体，支持移动端自适应和自动清理旧版 UI。", code: 'local Window = zhiUI:CreateWindow({Title = "zhiUI Hub"})' },
                    { id: "notif", type: "notify", name: "发送通知", desc: "在右下角弹出果冻反馈弹窗。", code: 'zhiUI:Notify("标题", "内容描述", 5)' },
                    { id: "tab", type: "elements", name: "添加分页", desc: "创建侧边栏分类页面。", code: 'local MainTab = Window:AddTab("主页")' },
                    { id: "btn", type: "elements", name: "按钮 (Button)", desc: "带有物理挤压感的回调按钮。", code: 'MainTab:AddButton("执行", function() print("Click!") end)' },
                    { id: "tog", type: "elements", name: "开关 (Toggle)", desc: "iOS 风格滑动开关，控制逻辑开启/关闭。", code: 'MainTab:AddToggle("开关", false, function(s) print(s) end)' },
                    { id: "sld", type: "elements", name: "滑动条 (Slider)", desc: "精确数值调节，适用于速度、重力调节。", code: 'MainTab:AddSlider("速度", 16, 200, 16, function(v) print(v) end)' },
                    { id: "drp", type: "elements", name: "下拉框 (Dropdown)", desc: "动态高度折叠菜单。", code: 'MainTab:AddDropdown("模式", {"A", "B"}, function(v) end)' },
                    { id: "inp", type: "elements", name: "输入框 (Input)", desc: "获取用户文本输入。", code: 'MainTab:AddInput("玩家ID", "输入...", function(t) end)' }
                ],
                copy: "复制",
                copied: "已复制!"
            },
            en: {
                title: "zhiUI Developer Docs",
                subtitle: "Modern Script UI Library optimized for Roblox performance.",
                sections: {
                    init: "Core Initialization",
                    notify: "Notification System",
                    elements: "All Components"
                },
                items: [
                    { id: "load", type: "init", name: "Remote Load", desc: "Paste this code at the top of your script to load zhiUI.", code: 'local zhiUI = loadstring(game:HttpGet("https://raw.githubusercontent.com/yda66722-hash/zhiUI/refs/heads/main/zhiUI"))()' },
                    { id: "win", type: "init", name: "Create Window", desc: "Initialize the main window with mobile scaling & auto-cleanup.", code: 'local Window = zhiUI:CreateWindow({Title = "zhiUI Hub"})' },
                    { id: "notif", type: "notify", name: "Notify", desc: "Pop up a jelly-style notification in the bottom right.", code: 'zhiUI:Notify("Title", "Description", 5)' },
                    { id: "tab", type: "elements", name: "Add Tab", desc: "Create a new category in the sidebar.", code: 'local MainTab = Window:AddTab("Home")' },
                    { id: "btn", type: "elements", name: "Button", desc: "Button with physical jelly feedback.", code: 'MainTab:AddButton("Execute", function() print("Click!") end)' },
                    { id: "tog", type: "elements", name: "Toggle", desc: "iOS style switch for boolean logic.", code: 'MainTab:AddToggle("Toggle", false, function(s) print(s) end)' },
                    { id: "sld", type: "elements", name: "Slider", desc: "Precise value adjustment for speed/gravity.", code: 'MainTab:AddSlider("Speed", 16, 200, 16, function(v) print(v) end)' },
                    { id: "drp", type: "elements", name: "Dropdown", desc: "Collapsible menu with dynamic height.", code: 'MainTab:AddDropdown("Mode", {"A", "B"}, function(v) end)' },
                    { id: "inp", type: "elements", name: "Input", desc: "Get user text input.", code: 'MainTab:AddInput("Player ID", "Enter...", function(t) end)' }
                ],
                copy: "Copy",
                copied: "Copied!"
            }
        };

        let currentLang = 'zh';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(lang === 'en' ? 'eng' : '中'));
            });
            render();
        }

        function copyCode(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.innerText;
                btn.innerText = translations[currentLang].copied;
                btn.style.background = "var(--success)";
                setTimeout(() => {
                    btn.innerText = original;
                    btn.style.background = "rgba(255,255,255,0.05)";
                }, 1500);
            });
        }

        function render() {
            const data = translations[currentLang];
            document.getElementById('main-title').innerText = data.title;
            document.getElementById('main-subtitle').innerText = data.subtitle;

            let sideHtml = '';
            let contentHtml = '';

            for (const [key, sectionTitle] of Object.entries(data.sections)) {
                sideHtml += `<div style="color:var(--accent); font-size:12px; margin:20px 0 10px 15px; font-weight:bold; text-transform:uppercase;">${sectionTitle}</div>`;
                contentHtml += `<h2 class="section-title" id="${key}">${sectionTitle}</h2>`;
                
                data.items.filter(i => i.type === key).forEach(item => {
                    sideHtml += `<a href="#${item.id}" class="nav-item">${item.name}</a>`;
                    contentHtml += `
                        <div class="card" id="${item.id}">
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                            <div class="code-block">
                                <button class="copy-btn" onclick="copyCode(this, \`${item.code}\`)">${data.copy}</button>
                                <pre><code>${item.code}</code></pre>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('side-nav').innerHTML = sideHtml;
            document.getElementById('content-area').innerHTML = contentHtml;
        }

        render();
    </script>
</body>
</html>

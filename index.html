<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhiUI Hub - Web Edition</title>
    <style>
        :root {
            --main-bg: #191919;
            --sidebar-bg: #202020;
            --accent: #007aff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --element-bg: rgba(45, 45, 45, 0.6);
            --transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* 主窗体 */
        .main-container {
            width: 550px;
            height: 380px;
            background-color: var(--main-bg);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            animation: spawn 0.5s var(--transition);
        }

        @keyframes spawn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 顶部控制栏 */
        .top-bar {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 18px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            margin-right: 9px;
            cursor: pointer;
        }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #28c940; }

        /* 内容区布局 */
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 160px;
            background-color: var(--sidebar-bg);
            opacity: 0.9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        .tab-btn {
            width: 85%;
            height: 45px;
            margin-bottom: 5px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.05);
        }

        .tab-btn.active {
            color: var(--text-primary);
            transform: scale(1.05);
        }

        /* 右侧容器 */
        .container {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar { width: 0; }

        /* 通用组件样式 */
        .element {
            background-color: var(--element-bg);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            min-height: 50px;
            transition: 0.2s;
        }

        .element:active { transform: scale(0.98); }

        .btn { width: 100%; justify-content: center; font-weight: bold; cursor: pointer; border: none; color: white; }
        
        /* 开关 Toggle */
        .toggle-box { justify-content: space-between; }
        .switch {
            width: 45px;
            height: 24px;
            background: #464646;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }
        .switch.on { background: var(--accent); }
        .switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .switch.on::after { left: 23px; }

        /* 滑动条 Slider */
        .slider-box { flex-direction: column; align-items: flex-start; padding: 10px 15px; }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            margin-top: 10px;
        }

        /* 输入框 Input */
        .input-box { justify-content: space-between; }
        input[type="text"] {
            background: #323232;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            color: white;
            width: 100px;
            outline: none;
        }

        /* 标签 Label & 分割线 Divider */
        .label { min-height: 30px; background: none; color: var(--text-secondary); font-style: italic; font-size: 13px; }
        .divider { height: 2px; background: var(--accent); opacity: 0.3; margin: 10px 0; border-radius: 2px; }

        /* 通知 Notify */
        #notification-area {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .notif {
            width: 250px;
            background: rgba(25, 25, 25, 0.9);
            border-radius: 8px;
            padding: 10px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.4s var(--transition);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainUI">
        <div class="top-bar">
            <div class="dot dot-red" onclick="closeUI()"></div>
            <div class="dot dot-yellow" onclick="minimizeUI()"></div>
            <div class="dot dot-green"></div>
            <span style="font-size: 14px; font-weight: bold; margin-left: 5px; opacity: 0.8;">zhiUI Hub</span>
        </div>

        <div class="content-wrapper">
            <div class="sidebar">
                <button class="tab-btn active">主功能</button>
                <button class="tab-btn">设置</button>
                <button class="tab-btn">关于</button>
            </div>

            <div class="container" id="content">
                <div class="element label">当前版本: v1.0.2 (Web)</div>
                
                <div class="element btn" onclick="notify('提示', '按钮已点击！')">点击测试按钮</div>
                
                <div class="element toggle-box">
                    <span>自动挂机</span>
                    <div class="switch" onclick="this.classList.toggle('on')"></div>
                </div>

                <div class="divider"></div>

                <div class="element slider-box">
                    <span>步行速度: <span id="speedVal">16</span></span>
                    <input type="range" min="16" max="200" value="16" oninput="document.getElementById('speedVal').innerText = this.value">
                </div>

                <div class="element input-box">
                    <span>玩家名称</span>
                    <input type="text" placeholder="输入ID...">
                </div>
            </div>
        </div>
    </div>

    <div id="notification-area"></div>

    <script>
        function notify(title, desc) {
            const area = document.getElementById('notification-area');
            const n = document.createElement('div');
            n.className = 'notif';
            n.innerHTML = `<strong style="color:var(--accent)">${title}</strong><br><small>${desc}</small>`;
            area.appendChild(n);
            setTimeout(() => {
                n.style.opacity = '0';
                n.style.transform = 'translateX(100%)';
                n.style.transition = '0.4s';
                setTimeout(() => n.remove(), 400);
            }, 3000);
        }

        function closeUI() {
            document.getElementById('mainUI').style.transform = 'scale(0)';
            document.getElementById('mainUI').style.opacity = '0';
        }

        function minimizeUI() {
            notify("系统", "已尝试最小化 (Web演示)");
        }
    </script>
</body>
</html>

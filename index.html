<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代码转文本下载器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        textarea { 
            width: 100%; 
            height: 300px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-family: monospace; 
            background-color: #f9f9f9;
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { 
            padding: 10px 20px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>代码下载器</h2>
    <p>在下方框内输入代码，然后点击按钮下载为 .txt 文件：</p>

    <textarea id="codeContent" placeholder="在此粘贴你的代码..."></textarea>

    <div class="controls">
        <input type="text" id="fileName" placeholder="文件名 (可选)" value="my_code">
        <span>.txt</span>
        <button onclick="downloadTxt()">立即下载</button>
    </div>

    <script>
        function downloadTxt() {
            // 1. 获取用户输入的内容和文件名
            const content = document.getElementById('codeContent').value;
            let name = document.getElementById('fileName').value || 'download';
            
            if (!content) {
                alert("请输入一些代码再尝试下载哦！");
                return;
            }

            // 2. 创建一个 Blob 对象，模拟文件数据
            const blob = new Blob([content], { type: 'text/plain' });
